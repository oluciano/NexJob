# SonarCloud automatic analysis settings. The product is the C# libraries under src/; the rest is not analysed.

# Samples are runnable examples (top-level statements, local credentials such as guest/guest), the Python and
# JavaScript files are documentation and test tooling, and .agents holds the squad's own scripts.
sonar.exclusions=samples/**,.agents/**,**/*.py

# The PostgreSQL and SQL Server providers are two implementations of the same storage contract and share long parallel
# blocks by design. Any pull request that edits one of those lines would otherwise fail the new-code duplication gate.
sonar.cpd.exclusions=src/NexJob.Postgres/PostgresStorageProvider.cs,src/NexJob.SqlServer/SqlServerStorageProvider.cs
