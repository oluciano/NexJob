[config]
model = "gemini/gemini-1.5-pro-latest"
model_weak = "gemini/gemini-1.5-flash-latest"
fallback_models = ["gemini/gemini-1.5-pro-latest"]
use_repo_settings_file = true

[pr_reviewer]
require_focused_review = false
require_score_review = true
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_code_suggestions = 4
extra_instructions = """
You are reviewing NexJob, a .NET 8 background job processing library.
Rules: Storage is source of truth, dispatcher is stateless, deadline enforced before execution. 
Zero warnings in Release builds. StyleCop enforced.
Test contract: flag every removed or changed assertion (.Should(), Assert., .Verify(, Times., Throw) and every removed [Fact]/[Theory] under tests/. A removal is acceptable only if the same assertion reappears elsewhere in the PR (a move), it is a named duplicate of a surviving test, or it carries "// Behavior changed in vX.Y: <reason>". Otherwise report it as a weakened test contract.
"""

[pr_description]
enable_semantic_files_types = true
collapsible_file_list = "adaptive"

[pr_code_suggestions]
num_code_suggestions = 4
rank_suggestions = true

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = false
