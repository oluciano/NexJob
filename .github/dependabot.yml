version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Test tooling and analyzers are grouped (a failure there never reaches the packages). The runtime dependencies of
    # the packages get one pull request each, so one bad update cannot sink the others.
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "FluentAssertions*"
          - "Moq"
          - "Testcontainers*"
          - "BenchmarkDotNet*"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Microsoft.AspNetCore.TestHost"
          - "Microsoft.Extensions.TimeProvider.Testing"
        update-types: [minor, patch]
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "SonarAnalyzer.CSharp"
          - "Meziantou.Analyzer"
          - "Microsoft.CodeAnalysis.NetAnalyzers"
          - "MinVer"
        update-types: [minor, patch]
    # Major versions are decided by the maintainer, not proposed weekly. The 10.x of the Microsoft families also drags
    # net8.0 projects to 10.x packages (NU1605 as errors), so those two families stay ignored.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The packages carry one reference per framework (8.x for net8.0, 10.0.0 for net10.0). Dependabot ignores the
      # Condition and moved the net8.0 lines to 10.x (#606), which raises the floor for every net8.0 consumer. The floors
      # stay at the lowest supported version and are moved by hand.
      - dependency-name: "Microsoft.Extensions.*"
      # An analyzer must stay on the oldest Roslyn it supports: 4.14 fails NexJob.Analyzers with CS1705 (#608).
      - dependency-name: "Microsoft.CodeAnalysis.CSharp*"
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["10.x"]
      - dependency-name: "System.Text.*"
        versions: ["10.x"]
    open-pull-requests-limit: 8

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Major versions (a new SDK, a new runtime image, a rewritten client library) are decided by the maintainer, not proposed weekly.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /docs/site
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
