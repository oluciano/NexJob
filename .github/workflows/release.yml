name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag does not already exist
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.skip == 'false'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        if: steps.tag_check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -c "
          import re, os
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(\"$VERSION\")}].*?\n(.*?)(?=\n## \[|$)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else ''
          with open('release_notes.md', 'w') as out:
              out.write(notes)
          "
          if [ -s release_notes.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.changelog.outputs.has_notes }}" = "true" ]; then
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file release_notes.md \
              --prerelease=${{ contains(steps.version.outputs.tag, '-') }}
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "${{ steps.version.outputs.tag }}" \
              --generate-notes \
              --prerelease=${{ contains(steps.version.outputs.tag, '-') }}
          fi
