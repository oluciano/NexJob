name: CI

on:
  pull_request:
    branches: [develop, main]

# Least privilege: the token can only read; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test and Collect
        run: |
          dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage/ --filter "Category!=Integration&Category!=Reliability&Category!=Stress&FullyQualifiedName!~Reliability&FullyQualifiedName!~Integration&FullyQualifiedName!~Stress"
          
      - name: Debug Coverage Files
        run: |
          echo "Listing all XML files in ./coverage:"
          find ./coverage -name "*.xml"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/*.xml" \
            -targetdir:"./coverage-report" \
            -reporttypes:TextSummary \
            -title:NexJob-Coverage \
            -assemblyfilters:"+NexJob;+NexJob.Dashboard;+NexJob.Dashboard.Standalone;+NexJob.Kafka;+NexJob.RabbitMQ;+NexJob.Trigger.*" \
            -classfilters:"-Eventbus.V1.*"

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(grep "Line coverage" ./coverage-report/Summary.txt | awk '{print $3}' | sed 's/%//')
          echo "Current Line Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Error: Line coverage ($COVERAGE%) is below 80%"
            exit 1
          fi

      - name: Upload unit test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-artifacts
          path: |
            **/TestResults/**/*.trx
            ./coverage-report/**

  integration-tests:
    name: Integration Tests - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: InMemory-EndToEnd
            project: tests/NexJob.IntegrationTests
            filter: '(FullyQualifiedName~InMemoryStorageProviderTests)|(FullyQualifiedName~JobExecutionEndToEndTests)'
          - name: Reliability-InMemory
            project: tests/NexJob.ReliabilityTests
            filter: 'Category=Reliability.InMemory'
          - name: Redis
            project: tests/NexJob.IntegrationTests
            filter: 'FullyQualifiedName~Redis'
          - name: Postgres
            project: tests/NexJob.IntegrationTests
            filter: 'FullyQualifiedName~Postgres'
          - name: Mongo
            project: tests/NexJob.IntegrationTests
            filter: 'FullyQualifiedName~Mongo'
          - name: SqlServer
            project: tests/NexJob.IntegrationTests
            filter: 'FullyQualifiedName~SqlServer'
          - name: RabbitMQ
            project: tests/NexJob.RabbitMQ.IntegrationTests
            filter: ''
          - name: Kafka
            project: tests/NexJob.Kafka.IntegrationTests
            filter: ''
          - name: Sqs
            project: tests/NexJob.Trigger.AwsSqs.IntegrationTests
            filter: ''
          - name: Salesforce
            project: tests/NexJob.Trigger.Salesforce.IntegrationTests
            filter: ''
          - name: GooglePubSub
            project: tests/NexJob.Trigger.GooglePubSub.IntegrationTests
            filter: ''

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: |
          if [ -n "${{ matrix.filter }}" ]; then
            dotnet test ${{ matrix.project }} \
              --no-build \
              --configuration Release \
              --verbosity normal \
              --filter "${{ matrix.filter }}" \
              --logger "trx;LogFileName=${{ matrix.name }}.trx" \
              --blame-hang \
              --blame-hang-timeout 5m
          else
            dotnet test ${{ matrix.project }} \
              --no-build \
              --configuration Release \
              --verbosity normal \
              --logger "trx;LogFileName=${{ matrix.name }}.trx" \
              --blame-hang \
              --blame-hang-timeout 5m
          fi

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-${{ matrix.name }}-artifacts
          path: |
            ${{ matrix.project }}/TestResults/**/*.trx
            ${{ matrix.project }}/TestResults/**/*

  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --severity warn --no-restore

  docs-truth:
    name: Docs Truth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reports the drift between the code and the wiki. It does not block the pull request yet: it becomes
    # blocking (--strict, no continue-on-error) when the baseline stays at zero.
    continue-on-error: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Compare the code with the wiki
        run: |
          dotnet run --project tools/DocsTruth -c Release -- --report docs-truth-report.md --strict || STATUS=$?
          cat docs-truth-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "${STATUS:-0}"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable packages found!"
            cat vulnerable.txt
            exit 1
          fi
          echo "No vulnerable packages found"

      - name: Upload security scan output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-scan-output
          path: vulnerable.txt
