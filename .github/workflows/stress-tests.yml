name: Stress & Load Tests

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of stress test iterations"
        required: false
        default: "1"

# Least privilege: the token can only read; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  stress-test:
    name: Production Stress Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/NexJob.StressTests/NexJob.StressTests.csproj

      - name: Run Production Stress Tests
        env:
          NEXJOB_STRESS_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
          NEXJOB_STRESS_REDIS: "localhost:6379"
        run: |
          dotnet test tests/NexJob.StressTests/NexJob.StressTests.csproj \
            -c Release \
            --filter "Category=Stress" \
            --logger "trx;LogFileName=stress-results.trx" \
            --logger "console;verbosity=normal"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-test-results
          path: tests/NexJob.StressTests/TestResults/stress-results.trx
