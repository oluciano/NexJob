name: Stress & Load Tests

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of stress test iterations"
        required: false
        default: "1"

# Least privilege: the token can only read; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  stress-test:
    name: Production Stress Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/NexJob.StressTests/NexJob.StressTests.csproj

      - name: Run Production Stress Tests
        env:
          NEXJOB_STRESS_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
          NEXJOB_STRESS_REDIS: "localhost:6379"
        run: |
          dotnet test tests/NexJob.StressTests/NexJob.StressTests.csproj \
            -c Release \
            --filter "Category=Stress" \
            --logger "trx;LogFileName=stress-results.trx" \
            --logger "console;verbosity=normal"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: tests/NexJob.StressTests/TestResults/stress-results.trx
