site_name: NexJob
site_description: Predictable and observable background job processing for .NET 8
site_url: https://oluciano.github.io/NexJob/
repo_url: https://github.com/oluciano/NexJob
repo_name: oluciano/NexJob
edit_uri: ""

# Built from a staged copy of docs/wiki; run docs/site/prepare.sh first.
docs_dir: .site-docs
site_dir: site
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - Introduction: introduction.md
      - Quickstart: quickstart.md
      - Mental Model: mental-model.md
  - Core Concepts:
      - Job Types: concepts/job-types.md
      - Scheduling: concepts/scheduling.md
      - Recurring Jobs: concepts/recurring-jobs.md
      - Retries & Dead Letter: concepts/retries-and-dead-letter.md
      - Delivery Guarantees: concepts/delivery-guarantees.md
      - Continuations: concepts/continuations.md
      - Idempotency: concepts/idempotency.md
  - Guides:
      - Throttling: guides/throttling.md
      - Circuit Breaker: guides/circuit-breaker.md
      - Execution Windows: guides/execution-windows.md
      - Runtime Control: guides/runtime-control.md
      - Multi-Service: guides/multi-service.md
      - Alerts: guides/alerts.md
      - Job Filters: guides/job-filters.md
      - Job Context: guides/job-context.md
      - Writing Tests: guides/writing-tests.md
      - Common Scenarios: guides/common-scenarios.md
      - Best Practices: guides/best-practices.md
  - Storage:
      - Overview: storage/overview.md
      - PostgreSQL: storage/postgresql.md
      - SQL Server: storage/sql-server.md
      - Redis: storage/redis.md
      - MongoDB: storage/mongodb.md
  - Integrations:
      - Dashboard: integrations/dashboard.md
      - OpenTelemetry: integrations/opentelemetry.md
      - External Triggers: integrations/triggers.md
      - Kafka: integrations/kafka.md
      - RabbitMQ: integrations/rabbitmq.md
  - Reference:
      - Configuration: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: reference/faq.md
      - Migration: reference/migration.md
      - How We Test: reference/how-we-test.md
      - Changelog: reference/changelog.md
